<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --cell: #2c2c2e;
      --cell-active: #3a3a3c;
      --text: #ffffff;
      --text-dim: #8e8e93;
      --blue: #0a84ff;
      --orange: #ff9f0a;
      --green: #30d158;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 16px);
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    #status {
      color: var(--text-dim);
      font-size: 1rem;
      min-height: 1.4em;
      margin-bottom: 18px;
      transition: color 0.2s;
    }
    #status.win { color: var(--green); font-weight: 600; }

    .mode-switch {
      display: flex;
      background: var(--card);
      border-radius: 10px;
      padding: 2px;
      margin-bottom: 18px;
    }
    .mode-switch button {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .mode-switch button.active {
      background: var(--cell-active);
      color: var(--text);
    }

    #scoreboard {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      width: 100%;
      max-width: 340px;
    }
    .score {
      flex: 1;
      background: var(--card);
      border-radius: 14px;
      padding: 10px 0;
      text-align: center;
      transition: box-shadow 0.2s;
    }
    .score .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .score .value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
    .score.x .value { color: var(--blue); }
    .score.o .value { color: var(--orange); }
    .score.turn { box-shadow: 0 0 0 2px var(--blue) inset; }
    .score.o.turn { box-shadow: 0 0 0 2px var(--orange) inset; }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      margin-bottom: 22px;
    }
    .cell {
      background: var(--cell);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.2rem, 13vw, 3.4rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .cell:active { transform: scale(0.94); background: var(--cell-active); }
    .cell.x { color: var(--blue); }
    .cell.o { color: var(--orange); }
    .cell.winner { background: var(--cell-active); animation: pop 0.35s ease; }
    .cell span { animation: drop 0.18s ease-out; display: block; }
    @keyframes drop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #reset {
      border: none;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 13px 44px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    #reset:active { transform: scale(0.96); filter: brightness(0.85); }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <p id="status">Your turn — you're X</p>

  <div class="mode-switch" id="modeSwitch">
    <button class="active" data-mode="ai">vs iPhone</button>
    <button data-mode="2p">2 Players</button>
  </div>

  <div id="scoreboard">
    <div class="score x turn"><div class="label" id="labelX">You (X)</div><div class="value" id="scoreX">0</div></div>
    <div class="score"><div class="label">Ties</div><div class="value" id="scoreT">0</div></div>
    <div class="score o"><div class="label" id="labelO">iPhone (O)</div><div class="value" id="scoreO">0</div></div>
  </div>

  <div id="board"></div>
  <button id="reset">New Game</button>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');
    const modeSwitch = document.getElementById('modeSwitch');
    const scoreEls = { X: document.getElementById('scoreX'), O: document.getElementById('scoreO'), tie: document.getElementById('scoreT') };
    const labelX = document.getElementById('labelX');
    const labelO = document.getElementById('labelO');
    const cardX = scoreEls.X.parentElement;
    const cardO = scoreEls.O.parentElement;

    const winningCombos = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let mode = 'ai';
    let board, current, gameOver, aiThinking;
    const scores = { X: 0, O: 0, tie: 0 };

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      boardEl.appendChild(cell);
    }
    const cells = [...boardEl.children];

    function newGame() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      aiThinking = false;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
      updateStatus();
    }

    function updateStatus() {
      cardX.classList.toggle('turn', !gameOver && current === 'X');
      cardO.classList.toggle('turn', !gameOver && current === 'O');
      statusEl.classList.remove('win');
      if (mode === 'ai') {
        statusEl.textContent = current === 'X' ? "Your turn — you're X" : 'iPhone is thinking…';
      } else {
        statusEl.textContent = (current === 'X' ? 'X' : 'O') + "'s turn";
      }
    }

    function place(index, player) {
      board[index] = player;
      const cell = cells[index];
      cell.classList.add(player.toLowerCase());
      const span = document.createElement('span');
      span.textContent = player;
      cell.appendChild(span);
      if (navigator.vibrate) navigator.vibrate(8);
    }

    function checkWinner(b) {
      for (const combo of winningCombos) {
        const [a, m, c] = combo;
        if (b[a] && b[a] === b[m] && b[a] === b[c]) return { winner: b[a], combo };
      }
      return b.every(v => v) ? { winner: 'tie' } : null;
    }

    function endGame(result) {
      gameOver = true;
      cardX.classList.remove('turn');
      cardO.classList.remove('turn');
      if (result.winner === 'tie') {
        statusEl.textContent = "It's a tie!";
        scores.tie++;
      } else {
        result.combo.forEach(i => cells[i].classList.add('winner'));
        statusEl.classList.add('win');
        if (mode === 'ai') {
          statusEl.textContent = result.winner === 'X' ? 'You win! 🎉' : 'iPhone wins!';
        } else {
          statusEl.textContent = result.winner + ' wins! 🎉';
        }
        scores[result.winner]++;
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
      }
      scoreEls[result.winner === 'tie' ? 'tie' : result.winner].textContent = scores[result.winner === 'tie' ? 'tie' : result.winner];
    }

    boardEl.addEventListener('click', e => {
      const cell = e.target.closest('.cell');
      if (!cell || gameOver || aiThinking) return;
      const index = +cell.dataset.index;
      if (board[index]) return;
      place(index, current);
      const result = checkWinner(board);
      if (result) { endGame(result); return; }
      current = current === 'X' ? 'O' : 'X';
      updateStatus();
      if (mode === 'ai' && current === 'O') {
        aiThinking = true;
        setTimeout(aiTurn, 350);
      }
    });

    function aiTurn() {
      aiThinking = false;
      if (gameOver) return;
      place(bestMove(), 'O');
      const result = checkWinner(board);
      if (result) { endGame(result); return; }
      current = 'X';
      updateStatus();
    }

    function bestMove() {
      let bestScore = -Infinity, move;
      for (let i = 0; i < 9; i++) {
        if (board[i]) continue;
        board[i] = 'O';
        const score = minimax(board, false);
        board[i] = null;
        if (score > bestScore) { bestScore = score; move = i; }
      }
      return move;
    }

    function minimax(b, isMaximizing) {
      const result = checkWinner(b);
      if (result) return result.winner === 'O' ? 1 : result.winner === 'X' ? -1 : 0;
      let best = isMaximizing ? -Infinity : Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i]) continue;
        b[i] = isMaximizing ? 'O' : 'X';
        const score = minimax(b, !isMaximizing);
        b[i] = null;
        best = isMaximizing ? Math.max(best, score) : Math.min(best, score);
      }
      return best;
    }

    modeSwitch.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn || btn.dataset.mode === mode) return;
      mode = btn.dataset.mode;
      modeSwitch.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      labelX.textContent = mode === 'ai' ? 'You (X)' : 'Player X';
      labelO.textContent = mode === 'ai' ? 'iPhone (O)' : 'Player O';
      scores.X = scores.O = scores.tie = 0;
      scoreEls.X.textContent = scoreEls.O.textContent = scoreEls.tie.textContent = '0';
      newGame();
    });

    resetBtn.addEventListener('click', newGame);
    newGame();
  </script>
</body>
</html>
